x-ws-volume: &ws .:/ws

x-gui: &gui
  network_mode: host
  volumes:
    - *ws
    - /tmp/.X11-unix:/tmp/.X11-unix
    - ${XAUTHORITY:-${HOME}/.Xauthority}:/tmp/.docker.xauth:ro
  environment:
    - DISPLAY=${DISPLAY}
    - XAUTHORITY=/tmp/.docker.xauth
  devices:
    - /dev/dri:/dev/dri
  stdin_open: true
  tty: true

services:
  # Developer build (build locally)
  dev:
    <<: *gui
    image: ghcr.io/goto-diplomarbeit/ros2_nav:latest
    build:
      context: .
      target: dev

  # Prebuilt image (pull from GitHub)
  release:
    <<: *gui
    image: ghcr.io/goto-diplomarbeit/ros2_nav:latest

  # Tests (uses the dev image)
  ci:
    image: ghcr.io/goto-diplomarbeit/ros2_nav:latest
    volumes:
      - *ws
    command: pytest /ws/src/goto/test/
