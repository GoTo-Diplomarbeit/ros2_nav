x-ws-volume: &ws .:/ws

x-gui: &gui
  network_mode: host
  volumes:
    - *ws
    - /tmp/.X11-unix:/tmp/.X11-unix
    - ${XAUTHORITY:-${HOME}/.Xauthority}:/tmp/.docker.xauth
    # Rootless Docker leaves /sys empty, so libdrm can't detect the render node
    # and Gazebo falls back to CPU rendering. Read-only mount fixes this.
    - /sys:/sys:ro
  environment:
    - DISPLAY=${DISPLAY}
    - XAUTHORITY=/tmp/.docker.xauth
  devices:
    - /dev/dri:/dev/dri
  stdin_open: true
  tty: true

# GUI + NVIDIA GPU passthrough; host needs nvidia-container-toolkit (can't live in the image)
x-nvidia: &nvidia
  <<: *gui
  environment:
    - DISPLAY=${DISPLAY}
    - XAUTHORITY=/tmp/.docker.xauth
    # Default is compute-only; "all" injects the NVIDIA OpenGL/EGL libs so Gazebo skips llvmpipe
    - NVIDIA_DRIVER_CAPABILITIES=all
  gpus: all

services:
  # Developer build (build locally)
  dev:
    <<: *gui
    image: ghcr.io/goto-diplomarbeit/ros2_nav:latest
    build:
      context: .
      target: dev

  # Prebuilt image (pull from GitHub)
  release:
    <<: *gui
    image: ghcr.io/goto-diplomarbeit/ros2_nav:latest

  # Prebuilt image with NVIDIA GPU
  release-nvidia:
    <<: *nvidia
    image: ghcr.io/goto-diplomarbeit/ros2_nav:latest

  # Tests (uses the dev image)
  ci:
    image: ghcr.io/goto-diplomarbeit/ros2_nav:latest
    volumes:
      - *ws
    command: pytest /ws/src/goto/test/
