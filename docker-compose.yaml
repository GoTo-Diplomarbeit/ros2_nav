x-ws-volume: &ws .:/ws

x-gui: &gui
  network_mode: host
  volumes:
    - *ws
    - /tmp/.X11-unix:/tmp/.X11-unix
    - ${XAUTHORITY:-${HOME}/.Xauthority}:/tmp/.docker.xauth
    # Rootless Docker leaves /sys empty, so libdrm can't detect the render node
    # and Gazebo falls back to CPU rendering. Read-only mount fixes this.
    - /sys:/sys:ro
    # photos taken by the vision node (saved to ~/go2_detections inside the container, which runs as root)
    - ${HOME}/go2_detections:/root/go2_detections
  environment:
    - DISPLAY=${DISPLAY}
    - XAUTHORITY=/tmp/.docker.xauth
    # Gazebo's GUI and server find each other over gz-transport, which by default
    # uses UDP multicast for discovery. On Arch (and CachyOS etc.) the loopback
    # interface has no multicast route, so the two never meet: the window opens but
    # stays blank and the log repeats "Requesting list of world names". Forcing
    # gz-transport onto loopback (everything runs in this one container anyway)
    # fixes discovery without touching the host network.
    - GZ_IP=127.0.0.1
  devices:
    - /dev/dri:/dev/dri
  stdin_open: true
  tty: true

# GUI + NVIDIA GPU passthrough; host needs nvidia-container-toolkit (can't live in the image)
x-nvidia: &nvidia
  <<: *gui
  environment:
    - DISPLAY=${DISPLAY}
    - XAUTHORITY=/tmp/.docker.xauth
    # Default is compute-only; "all" injects the NVIDIA OpenGL/EGL libs so Gazebo skips llvmpipe
    - NVIDIA_DRIVER_CAPABILITIES=all
    # See x-gui: without this Gazebo's GUI can't discover the server on Arch
    - GZ_IP=127.0.0.1
  gpus: all

services:
  # Developer build (build locally)
  dev:
    <<: *gui
    image: ghcr.io/goto-diplomarbeit/ros2_nav:latest
    build:
      context: .
      target: dev

  # Prebuilt image (pull from GitHub)
  release:
    <<: *gui
    image: ghcr.io/goto-diplomarbeit/ros2_nav:latest

  # Prebuilt image with NVIDIA GPU
  release-nvidia:
    <<: *nvidia
    image: ghcr.io/goto-diplomarbeit/ros2_nav:latest

  robot:
    image: ghcr.io/goto-diplomarbeit/ros2_nav:robot
    network_mode: host
    volumes:
      - *ws
    stdin_open: true
    tty: true
    build:
      context: .
      target: robot

  # Tests (uses the robot image, no simulator)
  ci:
    image: ghcr.io/goto-diplomarbeit/ros2_nav:robot
    volumes:
      - *ws
    command: pytest /ws/src/goto/test/
