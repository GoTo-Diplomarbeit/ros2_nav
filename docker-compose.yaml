services:
  # Developer build
  dev:
    # Build using the Dockerfile
    build:
      context: . # Use the project folder as context to have it accessible for copying and the Dockerfile
      target: dev # Target dev as base
    network_mode: host
    # Mount the volumes
    volumes:
      - .:/ws # Mount the project folder inside docker under /ws
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/tmp/.docker.xauth:ro
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.docker.xauth
    devices:
      - /dev/dri:/dev/dri
    stdin_open: true # Keep the terminal open after building
    tty: true # Give the build an interactive terminal

  # Testing build
  testing:
    image: ghcr.io/goto-diplomarbeit/ros2_nav-dev:latest
    network_mode: host
    # Mount the volumes
    volumes:
      - .:/ws # Mount the project folder inside docker under /ws
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/tmp/.docker.xauth:ro
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.docker.xauth
    devices:
      - /dev/dri:/dev/dri
    stdin_open: true # Keep the terminal open after building
    tty: true # Give the build an interactive terminal
