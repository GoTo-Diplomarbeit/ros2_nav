name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout goto
        uses: actions/checkout@v4

      - name: Run CI tests
        run: docker compose run --build --rm ci

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down
