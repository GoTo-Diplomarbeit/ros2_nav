name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull ci image
        run: docker compose pull ci

      - name: Lint
        run: |
          docker compose run --rm ci bash -c "
            pip install ruff --break-system-packages &&
            ruff check /ws/src/goto &&
            ruff format --check /ws/src/goto
          "

      - name: Run build
        run: |
          docker compose run --rm ci bash -c "
            source /opt/ros/jazzy/setup.bash &&
            source /unitree_go2_sim/install/setup.bash &&
            cd /ws &&
            colcon build --symlink-install --packages-select goto
          "

      - name: Run tests
        run: docker compose run --rm ci

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down

      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io
