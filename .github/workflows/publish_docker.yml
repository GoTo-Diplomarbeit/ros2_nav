name: Build and publish docker

on:
  workflow_dispatch:
    inputs:
      latest:
        description: "Also tag this build as :latest (dev) and :robot (robot)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [dev, robot]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Compute tags
        id: tags
        run: |
          IMAGE="ghcr.io/goto-diplomarbeit/ros2_nav"
          BRANCH_TAG="${GITHUB_REF_NAME//\//-}"
          if [ "${{ matrix.target }}" = "robot" ]; then PREFIX="robot-"; else PREFIX=""; fi
          TAGS="${IMAGE}:${PREFIX}${BRANCH_TAG},${IMAGE}:${PREFIX}${GITHUB_SHA::7}"
          if [ "${{ inputs.latest }}" = "true" ]; then
            if [ "${{ matrix.target }}" = "robot" ]; then
              TAGS="${TAGS},${IMAGE}:robot"
            else
              TAGS="${TAGS},${IMAGE}:latest"
            fi
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      # Latest commit of unitree_go2_ros2: used by the dev image to refresh its cache when that repo changes
      - name: Get unitree_go2_ros2 revision
        id: unitree
        run: echo "rev=$(git ls-remote https://github.com/GoTo-Diplomarbeit/unitree_go2_ros2 main | cut -f1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            UNITREE_REV=${{ steps.unitree.outputs.rev }}
          cache-from: type=registry,ref=ghcr.io/goto-diplomarbeit/ros2_nav:buildcache-${{ matrix.target }}
          cache-to: type=registry,ref=ghcr.io/goto-diplomarbeit/ros2_nav:buildcache-${{ matrix.target }},mode=max
