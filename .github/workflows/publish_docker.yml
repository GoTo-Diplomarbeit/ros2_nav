name: Build and publish docker

on:
  workflow_dispatch:
    inputs:
      latest:
        description: "Also tag this build as :latest"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Compute tags
        id: tags
        run: |
          BRANCH_TAG="${GITHUB_REF_NAME//\//-}"
          TAGS="ghcr.io/goto-diplomarbeit/ros2_nav:${BRANCH_TAG}"
          TAGS="${TAGS},ghcr.io/goto-diplomarbeit/ros2_nav:${GITHUB_SHA::7}"
          if [ "${{ inputs.latest }}" = "true" ]; then
            TAGS="${TAGS},ghcr.io/goto-diplomarbeit/ros2_nav:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: dev
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=ghcr.io/goto-diplomarbeit/ros2_nav:buildcache
          cache-to: type=registry,ref=ghcr.io/goto-diplomarbeit/ros2_nav:buildcache,mode=max
