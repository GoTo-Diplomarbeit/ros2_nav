slam_toolbox:
  ros__parameters:
    use_sim_time: true
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping
    resolution: 0.05

    # How often the occupancy grid is re-rendered and published on /map.
    # slam_toolbox's own default is 10.0 s, which makes the live view feel frozen.
    # This only affects how fresh the PICTURE is - scans are still collected at the
    # full ~8 Hz, so map detail and accuracy are unchanged either way.
    # Note: this is wall-clock seconds, not simulation time, and it is read once at
    # startup (a runtime "ros2 param set" is silently ignored - restart to apply).
    map_update_interval: 2.0
    max_laser_range: 8.0
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    transform_timeout: 0.5
    distance_variance_penalty: 1.0
    angle_variance_penalty: 2.0
    do_loop_closing: true
    min_pass_through: 3
    occupancy_threshold: 0.2
