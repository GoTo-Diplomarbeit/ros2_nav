# Nav2 settings that differ while the robot explores on its own (scripts/build_run_sim_autonomous_mapping.sh).
# They are merged into nav2_params.yaml at launch (goto/node_utils/merge_params.py); navigation and guiding keep
# the plain nav2_params.yaml. Only list what differs.

# The inflation radius for exploration. It is 0.45, the same as nav2_params.yaml, so right now nothing differs;
# this file is the place to try other values without touching navigation.
#
# Background: with inflation_radius 0.45 the cost drops to zero beyond 0.45 m, so the planner has no reason to
# stay farther from a wall than that and cuts corners right at the edge - where the 0.76 x 0.4 m footprint
# (corner radius 0.43 m) swings into the inflation zone. 0.9 m was tried: the cost then falls off smoothly (about
# 119 at 0.45 m, 56 at 0.7 m, 31 at 0.9 m) and paths prefer the middle of a corridor.
#
# cost_scaling_factor is not listed on purpose: if you change it, also set the RPP controller's own
# inflation_cost_scaling_factor (default 3.0) to the same value, otherwise its slow-down near obstacles is wrong.
local_costmap:
  local_costmap:
    ros__parameters:
      inflation_layer:
        inflation_radius: 0.45

global_costmap:
  global_costmap:
    ros__parameters:
      inflation_layer:
        inflation_radius: 0.45
