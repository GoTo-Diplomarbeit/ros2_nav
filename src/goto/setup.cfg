[develop]
script_dir=$base/lib/goto
[install]
install_scripts=$base/lib/goto

[tool:pytest]
# The importable package is this folder's goto/ subdirectory, so the import root is
# "." (i.e. src/goto) - NOT src/. Putting src/ on sys.path would make this folder
# itself the "goto" namespace package, and "goto.movement" would not exist.
# Relative paths are resolved against the rootdir, which pytest picks up from this
# file, so tests import correctly no matter the working directory or PYTHONPATH.
pythonpath = .
testpaths = test
